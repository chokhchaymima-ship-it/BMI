<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบลงทะเบียนและประเมินความเสี่ยงสุขภาพเบื้องต้น</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@mui/material@5.15.0/umd/material-ui.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@mui/icons-material@5.15.0/umd/material-ui-icons.production.min.js" crossorigin></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 50%, #e8f5e9 100%);
      min-height: 100vh;
    }
    #root { min-height: 100vh; }
    .MuiTypography-root, .MuiButton-root,
    .MuiInputBase-root, .MuiFormLabel-root,
    .MuiMenuItem-root, .MuiAlert-root,
    .MuiChip-root, .MuiDialogTitle-root,
    .MuiDialogContent-root {
      font-family: 'Sarabun', sans-serif !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      Container, Paper, Grid, Stack, Box,
      TextField, RadioGroup, Radio, Select, MenuItem,
      FormControl, FormControlLabel, FormLabel,
      Button, Alert, AlertTitle,
      Dialog, DialogTitle, DialogContent, DialogContentText, DialogActions,
      Chip, Typography, Divider, AppBar, Toolbar,
      LinearProgress, Tooltip, IconButton,
      createTheme, ThemeProvider, CssBaseline,
    } = MaterialUI;

    const Icons = MaterialUIIcons;

    // ─── Theme ──────────────────────────────────────────────────────────────────
    const theme = createTheme({
      palette: {
        primary:   { main: '#1976d2' },
        secondary: { main: '#7b1fa2' },
        success:   { main: '#2e7d32' },
        warning:   { main: '#f57c00' },
        error:     { main: '#c62828' },
      },
      typography: { fontFamily: "'Sarabun', sans-serif" },
      components: {
        MuiPaper:  { styleOverrides: { root: { borderRadius: 16 } } },
        MuiButton: { styleOverrides: { root: { borderRadius: 10, fontWeight: 600, fontSize: '1rem', fontFamily: "'Sarabun', sans-serif" } } },
        MuiTextField: { defaultProps: { size: 'small' } },
      },
    });

    // ─── Constants ───────────────────────────────────────────────────────────────
    const CHRONIC_DISEASES = [
      { value: 'none',       label: 'ไม่มีโรคประจำตัว' },
      { value: 'diabetes',   label: 'โรคเบาหวาน' },
      { value: 'hypertension', label: 'โรคความดันโลหิตสูง' },
      { value: 'heart',      label: 'โรคหัวใจ' },
      { value: 'kidney',     label: 'โรคไต' },
      { value: 'cancer',     label: 'โรคมะเร็ง' },
      { value: 'other',      label: 'โรคอื่น ๆ' },
    ];

    // ─── Risk Logic ──────────────────────────────────────────────────────────────
    function calculateBMI(weight, height) {
      const h = height / 100;
      return weight / (h * h);
    }

    function getBMICategory(bmi) {
      if (bmi < 18.5) return { label: 'น้ำหนักต่ำกว่าเกณฑ์', color: 'info' };
      if (bmi < 23)   return { label: 'น้ำหนักปกติ',           color: 'success' };
      if (bmi < 27.5) return { label: 'น้ำหนักเกิน',           color: 'warning' };
      return                 { label: 'อ้วน',                   color: 'error' };
    }

    function assessRisk(bmi, smoking, disease) {
      let score = 0;

      // BMI score
      if (bmi < 18.5)       score += 1;
      else if (bmi < 23)    score += 0;
      else if (bmi < 27.5)  score += 2;
      else                  score += 3;

      // Smoking score
      if (smoking === 'current') score += 3;
      else if (smoking === 'former') score += 1;

      // Disease score
      if (disease !== 'none') score += 2;
      if (disease === 'heart' || disease === 'cancer') score += 1;

      if (score <= 1)       return { level: 'low',      label: 'ความเสี่ยงต่ำ',      color: 'success', chipColor: '#2e7d32', bgColor: '#e8f5e9' };
      if (score <= 4)       return { level: 'moderate', label: 'ความเสี่ยงปานกลาง', color: 'warning', chipColor: '#f57c00', bgColor: '#fff3e0' };
      return                       { level: 'high',     label: 'ความเสี่ยงสูง',      color: 'error',   chipColor: '#c62828', bgColor: '#ffebee' };
    }

    function getRecommendations(riskLevel, bmi, smoking, disease) {
      const recs = [];
      if (riskLevel === 'low') {
        recs.push('✅ รักษาสุขภาพที่ดีด้วยการออกกำลังกายสม่ำเสมอ');
        recs.push('✅ รับประทานอาหารที่มีประโยชน์และครบหมู่');
        recs.push('✅ ตรวจสุขภาพประจำปีอย่างน้อยปีละครั้ง');
      } else if (riskLevel === 'moderate') {
        recs.push('⚠️ ควรพบแพทย์เพื่อรับการตรวจสุขภาพเพิ่มเติม');
        recs.push('⚠️ ปรับพฤติกรรมการรับประทานอาหารและออกกำลังกาย');
        if (smoking === 'current') recs.push('⚠️ แนะนำให้เลิกสูบบุหรี่ทันที');
        if (disease !== 'none') recs.push('⚠️ ติดตามอาการโรคประจำตัวอย่างสม่ำเสมอ');
      } else {
        recs.push('🚨 ต้องการการรักษาและติดตามจากแพทย์ผู้เชี่ยวชาญโดยด่วน');
        recs.push('🚨 งดสูบบุหรี่และหลีกเลี่ยงสิ่งที่เพิ่มความเสี่ยง');
        recs.push('🚨 ตรวจสุขภาพและวัดความดันโลหิตทุกเดือน');
        if (bmi >= 27.5) recs.push('🚨 วางแผนลดน้ำหนักร่วมกับนักโภชนาการ');
      }
      return recs;
    }

    // ─── Validation ──────────────────────────────────────────────────────────────
    function validate(form) {
      const errors = {};
      if (!form.firstName.trim()) errors.firstName = 'กรุณากรอกชื่อ';
      if (!form.lastName.trim())  errors.lastName  = 'กรุณากรอกนามสกุล';
      const age = Number(form.age);
      if (!form.age || isNaN(age) || age < 1 || age > 120)
        errors.age = 'กรุณากรอกอายุที่ถูกต้อง (1–120 ปี)';
      const weight = Number(form.weight);
      if (!form.weight || isNaN(weight) || weight < 10 || weight > 300)
        errors.weight = 'กรุณากรอกน้ำหนักที่ถูกต้อง (10–300 กก.)';
      const height = Number(form.height);
      if (!form.height || isNaN(height) || height < 50 || height > 250)
        errors.height = 'กรุณากรอกส่วนสูงที่ถูกต้อง (50–250 ซม.)';
      return errors;
    }

    // ─── Main App ────────────────────────────────────────────────────────────────
    function App() {
      const [form, setForm] = React.useState({
        firstName: '', lastName: '', age: '',
        weight: '', height: '',
        smoking: 'never',
        disease: 'none',
      });
      const [errors, setErrors]       = React.useState({});
      const [result, setResult]       = React.useState(null);
      const [dialogOpen, setDialogOpen] = React.useState(false);
      const [alertMsg, setAlertMsg]   = React.useState(null);

      const handleChange = (field) => (e) => {
        setForm(prev => ({ ...prev, [field]: e.target.value }));
        if (errors[field]) setErrors(prev => ({ ...prev, [field]: '' }));
      };

      const handleSubmit = () => {
        const errs = validate(form);
        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          setAlertMsg({ severity: 'error', text: 'กรุณากรอกข้อมูลให้ครบถ้วนและถูกต้อง' });
          return;
        }
        const bmi      = calculateBMI(Number(form.weight), Number(form.height));
        const bmiCat   = getBMICategory(bmi);
        const risk     = assessRisk(bmi, form.smoking, form.disease);
        const recs     = getRecommendations(risk.level, bmi, form.smoking, form.disease);
        setResult({ bmi, bmiCat, risk, recs });
        setAlertMsg(null);
        setDialogOpen(true);
      };

      const handleReset = () => {
        setForm({ firstName:'', lastName:'', age:'', weight:'', height:'', smoking:'never', disease:'none' });
        setErrors({});
        setResult(null);
        setAlertMsg(null);
      };

      const bmiPreview = (form.weight && form.height && !isNaN(Number(form.weight)) && !isNaN(Number(form.height)) && Number(form.height) > 0)
        ? calculateBMI(Number(form.weight), Number(form.height))
        : null;

      return (
        <ThemeProvider theme={theme}>
          <CssBaseline />

          {/* AppBar */}
          <AppBar position="static" elevation={0}
            sx={{ background: 'linear-gradient(90deg,#1565c0,#7b1fa2)', py: 0.5 }}>
            <Toolbar>
              <Icons.LocalHospital sx={{ mr: 1.5, fontSize: 32 }} />
              <Box>
                <Typography variant="h6" fontWeight={700} sx={{ lineHeight: 1.2 }}>
                  ระบบลงทะเบียนและประเมินความเสี่ยงสุขภาพเบื้องต้น
                </Typography>
                <Typography variant="caption" sx={{ opacity: 0.85 }}>
                  Patient Health Risk Assessment and Registration System
                </Typography>
              </Box>
            </Toolbar>
          </AppBar>

          <Container maxWidth="md" sx={{ py: 4 }}>

            {/* Alert banner */}
            {alertMsg && (
              <Alert severity={alertMsg.severity} onClose={() => setAlertMsg(null)} sx={{ mb: 2, borderRadius: 3 }}>
                <AlertTitle>{alertMsg.severity === 'error' ? 'ข้อมูลไม่ครบถ้วน' : 'สำเร็จ'}</AlertTitle>
                {alertMsg.text}
              </Alert>
            )}

            {/* ── Section 1: ข้อมูลส่วนบุคคล ── */}
            <Paper elevation={3} sx={{ p: 3, mb: 3 }}>
              <Stack direction="row" alignItems="center" spacing={1} mb={2}>
                <Icons.Person color="primary" />
                <Typography variant="h6" fontWeight={700} color="primary">
                  ข้อมูลส่วนบุคคล
                </Typography>
              </Stack>
              <Divider sx={{ mb: 2 }} />

              <Grid container spacing={2}>
                <Grid item xs={12} sm={6}>
                  <TextField fullWidth label="ชื่อ *" value={form.firstName}
                    onChange={handleChange('firstName')}
                    error={!!errors.firstName} helperText={errors.firstName}
                    InputProps={{ startAdornment: <Icons.Badge sx={{ mr:1, color:'text.secondary' }} /> }}
                  />
                </Grid>
                <Grid item xs={12} sm={6}>
                  <TextField fullWidth label="นามสกุล *" value={form.lastName}
                    onChange={handleChange('lastName')}
                    error={!!errors.lastName} helperText={errors.lastName}
                  />
                </Grid>
                <Grid item xs={12} sm={4}>
                  <TextField fullWidth label="อายุ (ปี) *" type="number" value={form.age}
                    onChange={handleChange('age')}
                    error={!!errors.age} helperText={errors.age}
                    inputProps={{ min: 1, max: 120 }}
                    InputProps={{ startAdornment: <Icons.Cake sx={{ mr:1, color:'text.secondary' }} /> }}
                  />
                </Grid>
                <Grid item xs={12} sm={4}>
                  <TextField fullWidth label="น้ำหนัก (กก.) *" type="number" value={form.weight}
                    onChange={handleChange('weight')}
                    error={!!errors.weight} helperText={errors.weight}
                    inputProps={{ min: 10, max: 300, step: 0.1 }}
                    InputProps={{ startAdornment: <Icons.Scale sx={{ mr:1, color:'text.secondary' }} /> }}
                  />
                </Grid>
                <Grid item xs={12} sm={4}>
                  <TextField fullWidth label="ส่วนสูง (ซม.) *" type="number" value={form.height}
                    onChange={handleChange('height')}
                    error={!!errors.height} helperText={errors.height}
                    inputProps={{ min: 50, max: 250 }}
                    InputProps={{ startAdornment: <Icons.Height sx={{ mr:1, color:'text.secondary' }} /> }}
                  />
                </Grid>
              </Grid>

              {/* BMI Preview */}
              {bmiPreview && bmiPreview > 0 && bmiPreview < 100 && (
                <Box mt={2} p={1.5} borderRadius={3} bgcolor="#f3f4f6"
                  display="flex" alignItems="center" gap={2} flexWrap="wrap">
                  <Typography variant="body2" color="text.secondary">
                    ค่า BMI เบื้องต้น:
                  </Typography>
                  <Chip label={`BMI = ${bmiPreview.toFixed(2)}`}
                    color={getBMICategory(bmiPreview).color}
                    icon={<Icons.MonitorWeight />} size="small" />
                  <Chip label={getBMICategory(bmiPreview).label}
                    color={getBMICategory(bmiPreview).color} variant="outlined" size="small" />
                </Box>
              )}
            </Paper>

            {/* ── Section 2: พฤติกรรมความเสี่ยง ── */}
            <Paper elevation={3} sx={{ p: 3, mb: 3 }}>
              <Stack direction="row" alignItems="center" spacing={1} mb={2}>
                <Icons.Warning color="warning" />
                <Typography variant="h6" fontWeight={700} color="warning.dark">
                  พฤติกรรมความเสี่ยงและโรคประจำตัว
                </Typography>
              </Stack>
              <Divider sx={{ mb: 2 }} />

              <Grid container spacing={3}>
                {/* Smoking – RadioGroup */}
                <Grid item xs={12} sm={6}>
                  <FormControl component="fieldset">
                    <FormLabel component="legend" sx={{ fontWeight: 600, mb: 1, color: 'text.primary' }}>
                      พฤติกรรมการสูบบุหรี่
                    </FormLabel>
                    <RadioGroup value={form.smoking} onChange={handleChange('smoking')}>
                      <FormControlLabel value="never"   control={<Radio color="success" />} label="ไม่เคยสูบบุหรี่" />
                      <FormControlLabel value="former"  control={<Radio color="warning" />} label="เคยสูบแต่เลิกแล้ว" />
                      <FormControlLabel value="current" control={<Radio color="error"   />} label="สูบบุหรี่อยู่ในปัจจุบัน" />
                    </RadioGroup>
                  </FormControl>
                </Grid>

                {/* Disease – Select */}
                <Grid item xs={12} sm={6}>
                  <FormControl fullWidth>
                    <FormLabel sx={{ fontWeight: 600, mb: 1, color: 'text.primary' }}>
                      โรคประจำตัว
                    </FormLabel>
                    <Select value={form.disease} onChange={handleChange('disease')} size="small">
                      {CHRONIC_DISEASES.map(d => (
                        <MenuItem key={d.value} value={d.value}>{d.label}</MenuItem>
                      ))}
                    </Select>
                  </FormControl>

                  {/* Risk indicator chips */}
                  <Stack direction="row" spacing={1} mt={2} flexWrap="wrap" useFlexGap>
                    <Chip size="small" icon={<Icons.SmokingRooms />}
                      label={form.smoking === 'never' ? 'ไม่สูบบุหรี่' : form.smoking === 'former' ? 'เลิกสูบแล้ว' : 'สูบบุหรี่'}
                      color={form.smoking === 'never' ? 'success' : form.smoking === 'former' ? 'warning' : 'error'}
                      variant="outlined"
                    />
                    <Chip size="small" icon={<Icons.MedicalServices />}
                      label={CHRONIC_DISEASES.find(d => d.value === form.disease)?.label}
                      color={form.disease === 'none' ? 'success' : 'error'}
                      variant="outlined"
                    />
                  </Stack>
                </Grid>
              </Grid>
            </Paper>

            {/* ── Action Buttons ── */}
            <Stack direction="row" spacing={2} justifyContent="center">
              <Button variant="contained" size="large"
                startIcon={<Icons.Assessment />}
                onClick={handleSubmit}
                sx={{ px: 4, background: 'linear-gradient(90deg,#1565c0,#7b1fa2)',
                  '&:hover': { background: 'linear-gradient(90deg,#0d47a1,#6a1b9a)' } }}>
                ประเมินผล
              </Button>
              <Button variant="outlined" size="large"
                startIcon={<Icons.Refresh />}
                onClick={handleReset} color="inherit">
                ล้างข้อมูล
              </Button>
            </Stack>

            {/* ── Footer ── */}
            <Box mt={5} textAlign="center">
              <Typography variant="caption" color="text.secondary">
                © 2026 ระบบประเมินความเสี่ยงสุขภาพเบื้องต้น · Patient Health Risk Assessment System
              </Typography>
            </Box>
          </Container>

          {/* ── Result Dialog ── */}
          <Dialog open={dialogOpen} onClose={() => setDialogOpen(false)}
            maxWidth="sm" fullWidth
            PaperProps={{ sx: { borderRadius: 4, overflow: 'hidden' } }}>
            {result && (
              <>
                <DialogTitle sx={{
                  background: result.risk.level === 'low'
                    ? 'linear-gradient(90deg,#2e7d32,#43a047)'
                    : result.risk.level === 'moderate'
                    ? 'linear-gradient(90deg,#e65100,#f57c00)'
                    : 'linear-gradient(90deg,#b71c1c,#c62828)',
                  color: '#fff', py: 2.5,
                }}>
                  <Stack direction="row" alignItems="center" spacing={1.5}>
                    {result.risk.level === 'low'
                      ? <Icons.CheckCircle sx={{ fontSize: 32 }} />
                      : result.risk.level === 'moderate'
                      ? <Icons.Warning sx={{ fontSize: 32 }} />
                      : <Icons.Dangerous sx={{ fontSize: 32 }} />}
                    <Box>
                      <Typography variant="h6" fontWeight={700}>
                        สรุปผลการประเมินสุขภาพ
                      </Typography>
                      <Typography variant="caption" sx={{ opacity: 0.9 }}>
                        Health Risk Assessment Report
                      </Typography>
                    </Box>
                  </Stack>
                </DialogTitle>

                <DialogContent sx={{ pt: 3, pb: 1 }}>
                  {/* Patient Info */}
                  <Paper variant="outlined" sx={{ p: 2, mb: 2, borderRadius: 3 }}>
                    <Stack direction="row" alignItems="center" spacing={1} mb={1}>
                      <Icons.Person color="primary" fontSize="small" />
                      <Typography fontWeight={700}>ข้อมูลผู้ป่วย</Typography>
                    </Stack>
                    <Grid container spacing={1}>
                      <Grid item xs={6}>
                        <Typography variant="body2" color="text.secondary">ชื่อ-นามสกุล</Typography>
                        <Typography fontWeight={600}>{form.firstName} {form.lastName}</Typography>
                      </Grid>
                      <Grid item xs={6}>
                        <Typography variant="body2" color="text.secondary">อายุ</Typography>
                        <Typography fontWeight={600}>{form.age} ปี</Typography>
                      </Grid>
                      <Grid item xs={6}>
                        <Typography variant="body2" color="text.secondary">น้ำหนัก / ส่วนสูง</Typography>
                        <Typography fontWeight={600}>{form.weight} กก. / {form.height} ซม.</Typography>
                      </Grid>
                      <Grid item xs={6}>
                        <Typography variant="body2" color="text.secondary">โรคประจำตัว</Typography>
                        <Typography fontWeight={600}>
                          {CHRONIC_DISEASES.find(d => d.value === form.disease)?.label}
                        </Typography>
                      </Grid>
                    </Grid>
                  </Paper>

                  {/* BMI Result */}
                  <Paper variant="outlined" sx={{ p: 2, mb: 2, borderRadius: 3, bgcolor: '#f9fafb' }}>
                    <Stack direction="row" alignItems="center" spacing={1} mb={1.5}>
                      <Icons.MonitorWeight color="primary" fontSize="small" />
                      <Typography fontWeight={700}>ค่าดัชนีมวลกาย (BMI)</Typography>
                    </Stack>
                    <Stack direction="row" alignItems="center" spacing={2} mb={1}>
                      <Typography variant="h4" fontWeight={800} color="primary">
                        {result.bmi.toFixed(2)}
                      </Typography>
                      <Chip label={result.bmiCat.label} color={result.bmiCat.color} />
                    </Stack>
                    <Typography variant="caption" color="text.secondary">
                      สูตร: BMI = น้ำหนัก (กก.) ÷ (ส่วนสูง (ม.))²
                    </Typography>
                    {/* BMI bar */}
                    <Box mt={1.5}>
                      <Box display="flex" justifyContent="space-between" mb={0.5}>
                        {['&lt;18.5', '18.5–23', '23–27.5', '≥27.5'].map((r, i) => (
                          <Typography key={i} variant="caption" color="text.secondary">{r}</Typography>
                        ))}
                      </Box>
                      <Box height={8} borderRadius={4} overflow="hidden"
                        sx={{ background: 'linear-gradient(90deg,#29b6f6 25%,#66bb6a 25% 50%,#ffa726 50% 75%,#ef5350 75%)' }}
                      />
                      <Box display="flex" justifyContent="space-between" mt={0.3}>
                        {['ต่ำกว่าเกณฑ์','ปกติ','เกินเกณฑ์','อ้วน'].map((l,i) => (
                          <Typography key={i} variant="caption" color="text.secondary" fontSize="0.6rem">{l}</Typography>
                        ))}
                      </Box>
                    </Box>
                  </Paper>

                  {/* Risk Level */}
                  <Box p={2} mb={2} borderRadius={3}
                    sx={{ bgcolor: result.risk.bgColor, border: `2px solid ${result.risk.chipColor}` }}>
                    <Stack direction="row" alignItems="center" spacing={2}>
                      <Chip label={result.risk.label}
                        sx={{ bgcolor: result.risk.chipColor, color: '#fff', fontWeight: 700, fontSize: '1rem', py: 2.5, px: 1 }}
                        icon={
                          result.risk.level === 'low'
                            ? <Icons.CheckCircle style={{ color: '#fff' }} />
                            : result.risk.level === 'moderate'
                            ? <Icons.Warning style={{ color: '#fff' }} />
                            : <Icons.Dangerous style={{ color: '#fff' }} />
                        }
                      />
                      <Typography variant="body2">
                        {result.risk.level === 'low'
                          ? 'สุขภาพอยู่ในเกณฑ์ดี ควรรักษาพฤติกรรมที่ดีต่อไป'
                          : result.risk.level === 'moderate'
                          ? 'ควรปรับพฤติกรรมและพบแพทย์เพื่อตรวจเพิ่มเติม'
                          : 'จำเป็นต้องได้รับการรักษาจากแพทย์ผู้เชี่ยวชาญโดยด่วน'}
                      </Typography>
                    </Stack>
                  </Box>

                  {/* Recommendations */}
                  <Typography fontWeight={700} mb={1}>คำแนะนำ</Typography>
                  <Stack spacing={0.75} mb={1}>
                    {result.recs.map((r, i) => (
                      <Typography key={i} variant="body2"
                        sx={{ p: 1, borderRadius: 2, bgcolor: '#f5f5f5' }}>{r}</Typography>
                    ))}
                  </Stack>
                </DialogContent>

                <DialogActions sx={{ px: 3, py: 2 }}>
                  <Button onClick={() => { setDialogOpen(false); handleReset(); }}
                    variant="outlined" startIcon={<Icons.Refresh />}>
                    ประเมินใหม่
                  </Button>
                  <Button onClick={() => window.print()} variant="contained"
                    startIcon={<Icons.Print />}>
                    พิมพ์ผล
                  </Button>
                  <Button onClick={() => setDialogOpen(false)} variant="contained" color="inherit">
                    ปิด
                  </Button>
                </DialogActions>
              </>
            )}
          </Dialog>
        </ThemeProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
